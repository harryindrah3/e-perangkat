<body><div class="preview-bar"><a href="index.html">← Kembali</a><div><b id="previewTitle">Pratinjau Paket Cetak</b><span id="pageStatus"></span></div><button onclick="window.print()">Cetak / Simpan PDF</button></div><main id="printRoot"></main><script src="data.js"></script><script src="assets/special-pai-v25.js"></script><script src="assets/print.js"></script><script src="assets/print-schedule-v22.js"></script><script src="assets/print-analysis-v7.js"></script><script src="assets/print-v3.js"></script><script src="assets/print-toc-v9.js"></script><script id="pdf-filename-helper">(function(){const clean=s=>String(s??'').replace(/[<>:"/\\|?*\u0000-\u001F]/g,' ').replace(/\s+/g,' ').trim(),roman={XII:'12',XI:'11',X:'10',IX:'9',VIII:'8',VII:'7',VI:'6',V:'5',IV:'4',III:'3',II:'2',I:'1'};function labeled(re){for(const tr of document.querySelectorAll('tr')){const c=[...tr.querySelectorAll('th,td')],l=clean(c[0]?.textContent);if(c.length&&re.test(l)&&!/(NIP|NUPTK)/i.test(l)){const v=clean(c[c.length-1]?.textContent);if(v&&v!==':')return v}}for(const dt of document.querySelectorAll('dt')){const l=clean(dt.textContent);if(re.test(l)&&!/(NIP|NUPTK)/i.test(l)){let n=dt.nextElementSibling;while(n&&n.tagName==='DD'&&clean(n.textContent)===':')n=n.nextElementSibling;const v=clean(n?.textContent);if(v)return v}}return''}function storedTeacher(){try{for(let i=0;i<localStorage.length;i++){const o=JSON.parse(localStorage.getItem(localStorage.key(i))||'null'),c=[o,o?.profile,...(Array.isArray(o?.orders)?o.orders.map(x=>x?.profile):[])];for(const x of c){const v=clean(x?.teacher);if(v)return v}}}catch(_){}return''}function setPdfName(){const p=clean(document.getElementById('previewTitle')?.textContent),m=p.match(/^Paket Cetak\s+(.+?)\s+Kelas\s+(.+)$/i),subject=clean(m?.[1])||labeled(/^Mata Pelajaran$/i)||'Mata Pelajaran';let kelas=clean(m?.[2])||clean(labeled(/^Kelas(?:\s*\/.*)?$/i).split('/')[0]);kelas=kelas.replace(/^(XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)\b/i,x=>roman[x.toUpperCase()]||x);const teacher=labeled(/^(?!.*Satuan\s+Pendidikan)(?:Nama\s+)?(?:Guru(?:\s+Mata\s+Pelajaran)?|Pengajar|Tutor|Pamong\s+Belajar|Pendidik)(?:\s*\/\s*(?:Guru|Pengajar|Tutor|Pamong\s+Belajar|Pendidik))*\s*:?\s*$/i)||storedTeacher()||'Nama Pengajar',q=new URLSearchParams(location.search).get('semester'),status=clean(document.getElementById('pageStatus')?.textContent),sm=status.match(/Semester\s+(1\s+dan\s+2|1|2)/i),semester=q==='1'?'Semester 1':q==='2'?'Semester 2':sm?`Semester ${sm[1]}`:'Semester 1 dan 2';document.title=clean(`${teacher} E-Perangkat ${subject} Kelas ${kelas} - ${semester}`)}window.preparePdfFilename=setPdfName;document.addEventListener('click',e=>{const b=e.target.closest?.('.preview-bar button');if(b&&/cetak|pdf/i.test(b.textContent||''))setPdfName()},true);window.addEventListener('beforeprint',setPdfName);setPdfName()})();</script></body></html>
