name: Release Erlangga Subject Names to Production

on:
  push:
    branches:
      - fix/erlangga-subject-names-20261108
    paths:
      - releases/calendar-2026-2027/catalog-erlangga.js
      - releases/calendar-2026-2027/erlangga-subject-name-fix.js
      - releases/calendar-2026-2027/apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/**
      - releases/calendar-2026-2027/apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/**
      - releases/calendar-2026-2027/apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/**
      - .github/workflows/release-erlangga-subject-names-production.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e-perangkat-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_DIR: releases/calendar-2026-2027
      STAGE_DIR: /tmp/e-perangkat-erlangga-subject-names
      STATUS_BRANCH: erlangga-subject-names-production-status-20261108
      TEAM_ID: team_i5YnQIDbBKi8FgTPI0YD6uOu
      PROJECT_ID: prj_KwCEjkE1OFX3CgBeBEenQcgX3P45
      TEAM_SLUG: harryindrah3-6239s-projects
      BASE_SHA: 1b14b6aea9a0513f2c862657976a47f3401016f0
      PREVIOUS_PROD_URL: https://e-perangkat-online-a-5ih62ivgj-harryindrah3-6239s-projects.vercel.app
      PROD_DOMAIN: https://e-perangkat-online-a-f.vercel.app
      PROD_ALIAS_1: e-perangkat-online-a-f.vercel.app
      PROD_ALIAS_2: e-perangkat-online-a-f-harryindrah3-6239s-projects.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/erlangga-subject-names-20261108
          fetch-depth: 0

      - name: Prepare status channel
        shell: bash
        run: |
          set -e
          git config user.name "Erlangga Subject Names Production"
          git config user.email "production@e-perangkat.local"
          git fetch origin "$STATUS_BRANCH:$STATUS_BRANCH"
          git worktree add /tmp/erlangga-subject-names-status "$STATUS_BRANCH"
          cat > /tmp/update-status.sh <<'EOS'
          #!/usr/bin/env bash
          set -e
          msg="$1"
          cd /tmp/erlangga-subject-names-status
          git fetch origin "$STATUS_BRANCH"
          git reset --hard "origin/$STATUS_BRANCH"
          printf "%s\n" "$msg" > ERLANGGA_SUBJECT_NAMES_PRODUCTION_STATUS.txt
          git add ERLANGGA_SUBJECT_NAMES_PRODUCTION_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(status): update Erlangga subject names production status"
            git push origin HEAD:"$STATUS_BRANCH" || true
          fi
          EOS
          chmod +x /tmp/update-status.sh
          /tmp/update-status.sh "VALIDATING_ERLANGGA_SUBJECT_NAMES"

      - name: Guard canonical subject names and no regressions
        shell: bash
        run: |
          set -e
          changed=$(git diff --name-only "$BASE_SHA"..HEAD -- "$RELEASE_DIR" || true)
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              "$RELEASE_DIR/catalog-erlangga.js"|"$RELEASE_DIR/erlangga-subject-name-fix.js") ;;
              "$RELEASE_DIR/apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/index.html"|"$RELEASE_DIR/apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/print.html") ;;
              "$RELEASE_DIR/apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/index.html"|"$RELEASE_DIR/apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/data.js"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/data.js"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/print.html") ;;
              "$RELEASE_DIR/apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/index.html"|"$RELEASE_DIR/apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/print.html") ;;
              *) echo "Unexpected Production release change: $file"; exit 1 ;;
            esac
          done <<< "$changed"

          node <<'NODE'
          const fs=require('fs');
          const root='releases/calendar-2026-2027';
          const runtime=fs.readFileSync(root+'/erlangga-subject-name-fix.js','utf8');
          const expected=[
            ['E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A','Pendidikan Agama Islam dan Budi Pekerti'],
            ['E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B','Pendidikan Agama Islam dan Budi Pekerti'],
            ['E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C','Pendidikan Agama Islam dan Budi Pekerti'],
            ['E-Perangkat_bahasa-indonesia-erlangga_Fase-B','Bahasa Indonesia'],
            ['E-Perangkat_ipas-erlangga_Fase-B','Ilmu Pengetahuan Alam dan Sosial (IPAS)'],
            ['E-Perangkat_matematika-erlangga_Fase-B','Matematika'],
            ['E-Perangkat_pendidikan-pancasila-erlangga_Fase-B','Pendidikan Pancasila'],
            ['E-Perangkat_seni-budaya-erlangga_Fase-B','Seni Budaya']
          ];
          for(const [needle,name] of expected){
            if(!runtime.includes(needle)||!runtime.includes('canonical:"'+name+'"')) throw new Error('Runtime mapping missing '+needle+' -> '+name);
          }

          const wrappers=[
            'apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/index.html',
            'apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/print.html',
            'apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/print.html',
            'apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/index.html',
            'apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/print.html',
            'apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/print.html',
            'apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/print.html',
            'apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/print.html',
            'apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/print.html',
            'apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/index.html',
            'apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/print.html'
          ];
          for(const rel of wrappers){
            const s=fs.readFileSync(root+'/'+rel,'utf8');
            if(!s.includes('/erlangga-subject-name-fix.js?v=20261108-1')) throw new Error('Name-fix loader missing '+rel);
          }

          const bi=JSON.parse(fs.readFileSync(root+'/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/data.js','utf8').replace(/^window\.EPERANGKAT_DATA=/,'').replace(/;\s*$/,''));
          if(bi.meta.abbreviation!=='Bahasa Indonesia Erlangga') throw new Error('Bahasa Indonesia abbreviation mismatch');
          const pp=JSON.parse(fs.readFileSync(root+'/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/data.js','utf8').replace(/^window\.EPERANGKAT_DATA=/,'').replace(/;\s*$/,''));
          if(pp.meta.abbreviation!=='Pendidikan Pancasila Erlangga') throw new Error('Pendidikan Pancasila abbreviation mismatch');

          const catalog=fs.readFileSync(root+'/catalog-erlangga.js','utf8');
          if((catalog.match(/"subject":"Pendidikan Agama Islam dan Budi Pekerti Versi Erlangga"/g)||[]).length!==3) throw new Error('PAI catalog subject names mismatch');
          if(!catalog.includes('"subject":"Bahasa Indonesia Versi Erlangga"')) throw new Error('Bahasa Indonesia catalog mismatch');
          if(!catalog.includes('"subject":"Ilmu Pengetahuan Alam dan Sosial (IPAS) Versi Erlangga"')) throw new Error('IPAS catalog mismatch');
          if(!catalog.includes('"subject":"Matematika Versi Erlangga"')) throw new Error('Matematika catalog mismatch');
          if(!catalog.includes('"subject":"Pendidikan Pancasila Versi Erlangga"')) throw new Error('Pancasila catalog mismatch');
          if(!catalog.includes('"subject":"Seni Budaya Versi Erlangga"')) throw new Error('Seni Budaya catalog mismatch');

          const index=fs.readFileSync(root+'/index.html','utf8');
          if(!index.includes("const LOGO_FIX = location.origin + '/logo-fix.js?v=20261018-2';")) throw new Error('Logo fix regression');
          if(!index.includes("const COPY_ORDER = location.origin + '/copy-order.js?v=20261016-1';")) throw new Error('Copy order regression');
          const db=fs.readFileSync(root+'/api/database.js','utf8');
          if(!db.includes('GOOGLE_APPS_SCRIPT_URL')||!db.includes('GOOGLE_APPS_SCRIPT_ACCESS_KEY')) throw new Error('Database regression');
          const logo=fs.readFileSync(root+'/logo-fix.js','utf8');
          for(const t of ["'logo-buol.png': 'data:image/png;base64","'tut-wuri-handayani.png': 'data:image/png;base64","'logo-kemenag.png': 'data:image/png;base64"]) if(!logo.includes(t)) throw new Error('Logo token missing '+t);
          const copy=fs.readFileSync(root+'/copy-order.js','utf8');
          if(!copy.includes('Salin ke Mapel')) throw new Error('Copy-order regression');
          console.log('ERLANGGA_SUBJECT_NAMES_NO_REGRESSION_GUARD_PASS');
          NODE
          /tmp/update-status.sh "ERLANGGA_SUBJECT_NAMES_NO_REGRESSION_GUARD_PASS"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel token
        shell: bash
        run: |
          set -e
          test -n "$VERCEL_TOKEN"
          vercel whoami
          /tmp/update-status.sh "AUTHENTICATED_WITH_TOKEN"

      - name: Stage exact release
        shell: bash
        run: |
          set -e
          rm -rf "$STAGE_DIR"
          cp -a "$RELEASE_DIR" "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > "$STAGE_DIR/.vercel/project.json"
          /tmp/update-status.sh "STAGED_ERLANGGA_SUBJECT_NAMES"

      - name: Deploy and verify Preview
        shell: bash
        run: |
          set -e
          PREVIEW_URL=$(vercel deploy --yes --scope "$TEAM_SLUG" --cwd "$STAGE_DIR" 2>&1 | tee /tmp/preview.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            cat /tmp/preview.log
            /tmp/update-status.sh "PREVIEW_DEPLOY_FAILED"
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          /tmp/update-status.sh "PREVIEW_DEPLOYED $PREVIEW_URL"
          sleep 6

          vercel curl "$PREVIEW_URL/erlangga-subject-name-fix.js" --scope "$TEAM_SLUG" > /tmp/name-fix.js
          grep -q 'canonical:"Pendidikan Pancasila"' /tmp/name-fix.js
          grep -q 'canonical:"Seni Budaya"' /tmp/name-fix.js
          grep -q 'canonical:"Bahasa Indonesia"' /tmp/name-fix.js
          grep -q 'canonical:"Ilmu Pengetahuan Alam dan Sosial (IPAS)"' /tmp/name-fix.js
          grep -q 'canonical:"Pendidikan Agama Islam dan Budi Pekerti"' /tmp/name-fix.js

          for rel in             "apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/print.html"             "apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/print.html"             "apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/print.html"             "apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/print.html"             "apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/print.html"             "apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/print.html"; do
            vercel curl "$PREVIEW_URL/$rel" --scope "$TEAM_SLUG" > /tmp/wrapper.html
            grep -q '/erlangga-subject-name-fix.js?v=20261108-1' /tmp/wrapper.html
          done
          /tmp/update-status.sh "PREVIEW_ERLANGGA_SUBJECT_NAMES_VERIFIED_OK $PREVIEW_URL"

      - name: Deploy Production
        shell: bash
        run: |
          set -e
          /tmp/update-status.sh "DEPLOYING_PRODUCTION"
          PROD_URL=$(vercel deploy --prod --yes --scope "$TEAM_SLUG" --cwd "$STAGE_DIR" 2>&1 | tee /tmp/prod.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$PROD_URL" ]; then
            cat /tmp/prod.log
            /tmp/update-status.sh "PRODUCTION_DEPLOY_FAILED"
            exit 1
          fi
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          /tmp/update-status.sh "PRODUCTION_DEPLOYED $PROD_URL"
          sleep 10

      - name: Verify Production and rollback on failure
        shell: bash
        run: |
          set +e
          verify_prod() {
            curl -fsS "$PROD_DOMAIN/erlangga-subject-name-fix.js" > /tmp/prod-name-fix.js || return 1
            grep -q 'canonical:"Pendidikan Pancasila"' /tmp/prod-name-fix.js || return 1
            grep -q 'canonical:"Seni Budaya"' /tmp/prod-name-fix.js || return 1
            grep -q 'canonical:"Bahasa Indonesia"' /tmp/prod-name-fix.js || return 1
            grep -q 'canonical:"Ilmu Pengetahuan Alam dan Sosial (IPAS)"' /tmp/prod-name-fix.js || return 1
            grep -q 'canonical:"Pendidikan Agama Islam dan Budi Pekerti"' /tmp/prod-name-fix.js || return 1

            curl -fsS "$PROD_DOMAIN/apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/data.js" > /tmp/pp-data.js || return 1
            grep -q '"abbreviation":"Pendidikan Pancasila Erlangga"' /tmp/pp-data.js || return 1
            curl -fsS "$PROD_DOMAIN/apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/data.js" > /tmp/bi-data.js || return 1
            grep -q '"abbreviation":"Bahasa Indonesia Erlangga"' /tmp/bi-data.js || return 1
            curl -fsS "$PROD_DOMAIN/catalog-erlangga.js" > /tmp/catalog.js || return 1
            grep -q '"subject":"Ilmu Pengetahuan Alam dan Sosial (IPAS) Versi Erlangga"' /tmp/catalog.js || return 1
            grep -q '"subject":"Pendidikan Pancasila Versi Erlangga"' /tmp/catalog.js || return 1

            for rel in               "apps/fase-a/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-A/print.html"               "apps/fase-b/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-B/print.html"               "apps/fase-c/E-Perangkat_pendidikan-agama-islam-erlangga_Fase-C/print.html"               "apps/fase-b/E-Perangkat_bahasa-indonesia-erlangga_Fase-B/print.html"               "apps/fase-b/E-Perangkat_ipas-erlangga_Fase-B/print.html"               "apps/fase-b/E-Perangkat_matematika-erlangga_Fase-B/print.html"               "apps/fase-b/E-Perangkat_pendidikan-pancasila-erlangga_Fase-B/print.html"               "apps/fase-b/E-Perangkat_seni-budaya-erlangga_Fase-B/print.html"; do
              curl -fsS "$PROD_DOMAIN/$rel" > /tmp/prod-wrapper.html || return 1
              grep -q '/erlangga-subject-name-fix.js?v=20261108-1' /tmp/prod-wrapper.html || return 1
            done

            curl -fsS "$PROD_DOMAIN/api/database?action=ping" > /tmp/prod-ping.json || return 1
            grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/prod-ping.json || return 1
            curl -fsS "$PROD_DOMAIN/logo-fix.js" > /tmp/prod-logo.js || return 1
            grep -q "'logo-kemenag.png': 'data:image/png;base64" /tmp/prod-logo.js || return 1
            curl -fsS "$PROD_DOMAIN/copy-order.js" > /tmp/prod-copy.js || return 1
            grep -q 'Salin ke Mapel' /tmp/prod-copy.js || return 1
            return 0
          }

          if verify_prod; then
            /tmp/update-status.sh "PRODUCTION_ERLANGGA_SUBJECT_NAMES_VERIFIED_OK $PROD_URL"
            exit 0
          fi

          /tmp/update-status.sh "PRODUCTION_VERIFY_FAILED_RESTORING_PREVIOUS"
          vercel alias set "$PREVIOUS_PROD_URL" "$PROD_ALIAS_1" --scope "$TEAM_SLUG"
          vercel alias set "$PREVIOUS_PROD_URL" "$PROD_ALIAS_2" --scope "$TEAM_SLUG"
          sleep 6
          curl -fsS "$PROD_DOMAIN/index.html" > /tmp/restored-index.html
          grep -q "E-Perangkat Online A–F" /tmp/restored-index.html
          /tmp/update-status.sh "RESTORED_PREVIOUS_PRODUCTION $PREVIOUS_PROD_URL"
          exit 1
