name: Check Vercel Token

on:
  push:
    branches:
      - fix/sync-backend-20261018
    paths:
      - .github/workflows/check-vercel-token.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 2
          fi
          echo "VERCEL_TOKEN is present"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Verify Vercel authentication
        shell: bash
        run: |
          vercel whoami --token "$VERCEL_TOKEN"
