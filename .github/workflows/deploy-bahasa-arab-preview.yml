name: Deploy Bahasa Arab Fase D Preview
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bahasa-arab-fase-d-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATUS_BRANCH: bahasa-arab-preview-status-20260929
      TEAM_ID: team_i5YnQIDbBKi8FgTPI0YD6uOu
      PROJECT_ID: prj_bLbby6VgNMllWfgTOuVNitDXicfF
      TEAM_SLUG: harryindrah3-6239s-projects
      APP_DIR: apps/fase-d/E-Perangkat_bahasa-arab_Fase-D
      STAGE_DIR: /tmp/e-perangkat-bahasa-arab-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/bahasa-arab-fase-d-20260929
          fetch-depth: 0

      - name: Prepare status channel
        shell: bash
        run: |
          set -e
          git config user.name "Bahasa Arab Preview"
          git config user.email "preview@e-perangkat.local"
          git fetch origin "$STATUS_BRANCH:$STATUS_BRANCH"
          git worktree add /tmp/arabic-preview-status "$STATUS_BRANCH"
          cat > /tmp/update-arabic-preview-status.sh <<'EOS'
          #!/usr/bin/env bash
          set -e
          msg="$1"
          cd /tmp/arabic-preview-status
          git fetch origin "$STATUS_BRANCH"
          git reset --hard "origin/$STATUS_BRANCH"
          printf "%s\n" "$msg" > BAHASA_ARAB_PREVIEW_STATUS.txt
          git add BAHASA_ARAB_PREVIEW_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview-status): update Bahasa Arab Fase D preview status"
            git push origin HEAD:"$STATUS_BRANCH" || true
          fi
          EOS
          chmod +x /tmp/update-arabic-preview-status.sh
          /tmp/update-arabic-preview-status.sh "VALIDATING_LATEST_PARITY"

      - name: Validate source and audited Production parity
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const fs=require('fs');
          const dir='apps/fase-d/E-Perangkat_bahasa-arab_Fase-D';
          const raw=fs.readFileSync(dir+'/data.js','utf8').replace(/^window\.EPERANGKAT_DATA\s*=\s*/,'').replace(/;\s*$/,'');
          const d=JSON.parse(raw);

          if(d.meta.subject!=='Bahasa Arab') throw new Error('Subject mismatch');
          if(d.modules.length!==18) throw new Error('Expected 18 Bahasa Arab modules');
          for(const g of ['VII','VIII','IX']){
            const mods=d.modules.filter(m=>m.grade===g);
            if(mods.length!==6) throw new Error('Expected 6 modules for '+g);
            if(!mods.every(m=>m.meetings?.length===6)) throw new Error('Meeting count mismatch '+g);
            if(!mods.every(m=>m.objectives?.length===4)) throw new Error('Objective count mismatch '+g);
          }

          const index=fs.readFileSync(dir+'/index.html','utf8');
          const print=fs.readFileSync(dir+'/print.html','utf8');
          for(const html of [index,print]){
            if(!html.includes('assets/arabic-storage-migration.js?v=20261002-1')) throw new Error('Arabic storage migration missing');
            if(!html.includes('production-parity-v20260930.js?v=20261002-3')) throw new Error('Audited parity loader missing');
          }
          if(index.indexOf('arabic-storage-migration.js')>index.indexOf('assets/v3-bootstrap.js')) throw new Error('Storage migration must load before app bootstrap');
          if(print.indexOf('arabic-storage-migration.js')>print.indexOf('assets/print.js')) throw new Error('Storage migration must load before print engine');

          const core=[
            'site.js','v3.js','analysis-v7.js','schedule-v22.js','signature-v22.js',
            'print.js','print-v3.js','print-analysis-v7.js','print-schedule-v22.js',
            'print-toc-v9.js','special-pai-v25.js','v3-bootstrap.js'
          ];
          for(const file of core){
            const text=fs.readFileSync(dir+'/assets/'+file,'utf8');
            if(/bahasa-inggris|Bahasa Inggris|B\. Inggris/.test(text)) throw new Error('Inherited Bahasa Inggris identity remains in '+file);
          }

          const storageFiles=[
            'site.js','v3.js','analysis-v7.js','schedule-v22.js','signature-v22.js',
            'print.js','print-v3.js','print-analysis-v7.js','print-schedule-v22.js',
            'print-toc-v9.js','special-pai-v25.js','v3-bootstrap.js'
          ];
          for(const file of storageFiles){
            const text=fs.readFileSync(dir+'/assets/'+file,'utf8');
            if(text.includes('eperangkat.') && !text.includes('eperangkat.bahasa-arab.fased.v1') && !file.startsWith('print-integrity')){
              throw new Error('Expected Arabic storage namespace not found in '+file);
            }
          }

          const migration=fs.readFileSync(dir+'/assets/arabic-storage-migration.js','utf8');
          if(!migration.includes("eperangkat.bahasa-inggris.fased.v1") || !migration.includes("eperangkat.bahasa-arab.fased.v1")){
            throw new Error('Safe legacy namespace migration incomplete');
          }

          const runtime=[
            'calendar-year.js','calendar-level-runtime.js','calendar-source-runtime.js','calendar-2024-extension.js',
            'kktp-order-runtime.js','differentiation-runtime.js','print-safe-pages.js','print-filename.js',
            'promes-print-route-fix.js','logo-fix.js','grade-one-cover.js','copy-order.js',
            'phase-c-supervision.js','identity-fix.js','uploaded-schedule-print.js','print-safety-v2.js'
          ];
          for(const file of runtime){
            if(!fs.existsSync(dir+'/assets/latest-runtime/'+file)) throw new Error('Missing Production runtime '+file);
          }

          const loader=fs.readFileSync(dir+'/assets/production-parity-v20260930.js','utf8');
          const required=[
            'calendar-year.js','calendar-2024-extension.js','calendar-level-runtime.js','calendar-source-runtime.js',
            'kktp-order-runtime.js','promes-print-route-fix.js','phase-c-supervision.js',
            'uploaded-schedule-print.js','print-safety-v2.js','differentiation-runtime.js',
            'print-safe-pages.js','print-filename.js','20261002-v3'
          ];
          for(const token of required) if(!loader.includes(token)) throw new Error('Parity loader missing '+token);

          const kaldik=fs.readFileSync(dir+'/assets/latest-runtime/calendar-year.js','utf8');
          const kaldik24=fs.readFileSync(dir+'/assets/latest-runtime/calendar-2024-extension.js','utf8');
          const kktp=fs.readFileSync(dir+'/assets/latest-runtime/kktp-order-runtime.js','utf8');
          if(!kaldik.includes('epCalendarYear') || !kaldik.includes('2026/2027')) throw new Error('Calendar selector runtime incomplete');
          if(!kaldik24.includes('2024/2025')) throw new Error('Calendar 2024/2025 extension missing');
          if(!kktp.includes('KKTP mengikuti Pesanan')) throw new Error('Order-driven KKTP runtime incomplete');

          console.log('BAHASA_ARAB_PRODUCTION_PARITY_SOURCE_PASS');
          NODE
          /tmp/update-arabic-preview-status.sh "BAHASA_ARAB_PRODUCTION_PARITY_SOURCE_PASS"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate Vercel for this preview
        shell: bash
        run: |
          set -e
          vercel login --github > /tmp/vercel-login.log 2>&1 &
          PID=$!
          LOGIN_URL=""
          for i in $(seq 1 120); do
            LOGIN_URL=$(grep -Eo 'https://vercel.com/oauth/device\?user_code=[A-Z0-9-]+' /tmp/vercel-login.log | tail -1 || true)
            if [ -n "$LOGIN_URL" ]; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ -z "$LOGIN_URL" ]; then
            cat /tmp/vercel-login.log
            /tmp/update-arabic-preview-status.sh "LOGIN_URL_NOT_FOUND"
            exit 1
          fi
          /tmp/update-arabic-preview-status.sh "AUTHORIZE $LOGIN_URL"
          wait "$PID"
          vercel whoami
          /tmp/update-arabic-preview-status.sh "AUTHENTICATED"

      - name: Stage isolated preview
        shell: bash
        run: |
          set -e
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/apps/fase-d"
          cp -a "$APP_DIR" "$STAGE_DIR/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D"
          printf '{}\n' > "$STAGE_DIR/vercel.json"
          cat > "$STAGE_DIR/index.html" <<'HTML'
          <!doctype html>
          <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview E-Perangkat Bahasa Arab Fase D</title></head>
          <body><p style="font-family:Arial,sans-serif;padding:24px">Memuat Preview Bahasa Arab Fase D…</p>
          <script>location.replace('/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D/index.html'+location.search+location.hash)</script>
          </body></html>
          HTML
          mkdir -p "$STAGE_DIR/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > "$STAGE_DIR/.vercel/project.json"

      - name: Deploy latest parity preview
        shell: bash
        run: |
          set -e
          /tmp/update-arabic-preview-status.sh "DEPLOYING_LATEST_PARITY"
          DEPLOY_URL=$(vercel deploy --yes --scope "$TEAM_SLUG" --cwd "$STAGE_DIR" 2>&1 | tee /tmp/deploy.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            cat /tmp/deploy.log
            /tmp/update-arabic-preview-status.sh "DEPLOY_FAILED"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          /tmp/update-arabic-preview-status.sh "DEPLOYED $DEPLOY_URL"

      - name: Verify live latest parity
        shell: bash
        run: |
          set -e
          sleep 5
          APP_PATH="/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D"
          vercel curl "$DEPLOY_URL$APP_PATH/index.html" --scope "$TEAM_SLUG" > /tmp/index.html
          vercel curl "$DEPLOY_URL$APP_PATH/assets/production-parity-v20260930.js" --scope "$TEAM_SLUG" > /tmp/parity.js
          vercel curl "$DEPLOY_URL$APP_PATH/assets/latest-runtime/kktp-order-runtime.js" --scope "$TEAM_SLUG" > /tmp/kktp.js
          vercel curl "$DEPLOY_URL$APP_PATH/assets/latest-runtime/calendar-year.js" --scope "$TEAM_SLUG" > /tmp/kaldik.js
          vercel curl "$DEPLOY_URL$APP_PATH/assets/latest-runtime/phase-c-supervision.js" --scope "$TEAM_SLUG" > /tmp/supervision.js
          grep -q "Bahasa Arab" /tmp/index.html
          grep -q "20260930-v2" /tmp/parity.js
          grep -q "KKTP mengikuti Pesanan" /tmp/kktp.js
          grep -q "2026/2027" /tmp/kaldik.js
          grep -q "data-ep-supervision-detail" /tmp/supervision.js
          /tmp/update-arabic-preview-status.sh "VERIFIED_LATEST_OK $DEPLOY_URL"
