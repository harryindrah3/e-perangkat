name: Deploy Bahasa Arab Fase D Preview
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATUS_BRANCH: bahasa-arab-preview-status-20260929
      TEAM_ID: team_i5YnQIDbBKi8FgTPI0YD6uOu
      PROJECT_ID: prj_bLbby6VgNMllWfgTOuVNitDXicfF
      TEAM_SLUG: harryindrah3-6239s-projects
      APP_DIR: apps/fase-d/E-Perangkat_bahasa-arab_Fase-D
      STAGE_DIR: /tmp/e-perangkat-bahasa-arab-preview

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/bahasa-arab-fase-d-20260929
          fetch-depth: 0

      - name: Prepare status channel
        shell: bash
        run: |
          set -e
          git config user.name "Bahasa Arab Preview"
          git config user.email "preview@e-perangkat.local"
          git fetch origin "$STATUS_BRANCH:$STATUS_BRANCH"
          git worktree add /tmp/arabic-preview-status "$STATUS_BRANCH"
          cat > /tmp/update-arabic-preview-status.sh <<'EOS'
          #!/usr/bin/env bash
          set -e
          msg="$1"
          cd /tmp/arabic-preview-status
          printf "%s\n" "$msg" > BAHASA_ARAB_PREVIEW_STATUS.txt
          git add BAHASA_ARAB_PREVIEW_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview-status): update Bahasa Arab Fase D preview status"
            git push origin HEAD:"$STATUS_BRANCH" || true
          fi
          EOS
          chmod +x /tmp/update-arabic-preview-status.sh
          /tmp/update-arabic-preview-status.sh "PREPARING_PARITY_VALIDATION"

      - name: Validate latest E-Perangkat parity
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const fs=require('fs');
          const dir='apps/fase-d/E-Perangkat_bahasa-arab_Fase-D';
          const raw=fs.readFileSync(dir+'/data.js','utf8').replace(/^window\.EPERANGKAT_DATA\s*=\s*/,'').replace(/;\s*$/,'');
          const d=JSON.parse(raw);
          if(d.meta.subject!=='Bahasa Arab') throw new Error('Subject mismatch');
          if(d.modules.length!==18) throw new Error('Expected 18 modules');
          for(const g of ['VII','VIII','IX']){
            const mods=d.modules.filter(m=>m.grade===g);
            if(mods.length!==6) throw new Error('Expected 6 modules for '+g);
            if(!mods.every(m=>m.meetings?.length===6)) throw new Error('Meeting count mismatch '+g);
          }
          const index=fs.readFileSync(dir+'/index.html','utf8');
          const print=fs.readFileSync(dir+'/print.html','utf8');
          for(const token of ['calendar-year.js','calendar-level-runtime.js','calendar-source-runtime.js','kktp-order-runtime.js','production-parity-v20260930.js']){
            if(!index.includes(token)) throw new Error('Index parity missing '+token);
            if(!print.includes(token)) throw new Error('Print parity missing '+token);
          }
          for(const file of ['calendar-level-runtime.js','calendar-year.js','calendar-source-runtime.js','calendar-2024-extension.js','kktp-order-runtime.js']){
            if(!fs.existsSync(file)) throw new Error('Root runtime missing '+file);
          }
          if(!index.includes('Kalender Pendidikan') || !index.includes('KKTP') || !index.includes('Analisis Nilai')) throw new Error('Core menus incomplete');
          console.log('PARITY_VALIDATION_PASS');
          NODE
          /tmp/update-arabic-preview-status.sh "PARITY_VALIDATION_PASS"

      - name: Stage isolated preview
        shell: bash
        run: |
          set -e
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/apps/fase-d"
          cp -a "$APP_DIR" "$STAGE_DIR/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D"
          cp calendar-level-runtime.js calendar-year.js calendar-source-runtime.js calendar-2024-extension.js kktp-order-runtime.js "$STAGE_DIR/"
          printf '{}\n' > "$STAGE_DIR/vercel.json"
          cat > "$STAGE_DIR/index.html" <<'HTML'
          <!doctype html>
          <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview E-Perangkat Bahasa Arab Fase D</title></head>
          <body><p style="font-family:Arial,sans-serif;padding:24px">Memuat Preview Bahasa Arab Fase D…</p>
          <script>location.replace('/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D/index.html'+location.search+location.hash)</script>
          </body></html>
          HTML

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate Vercel once
        shell: bash
        run: |
          set -e
          vercel login --github > /tmp/vercel-login.log 2>&1 &
          PID=$!
          LOGIN_URL=""
          for i in $(seq 1 120); do
            LOGIN_URL=$(grep -Eo 'https://vercel.com/oauth/device\?user_code=[A-Z0-9-]+' /tmp/vercel-login.log | tail -1 || true)
            if [ -n "$LOGIN_URL" ]; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ -z "$LOGIN_URL" ]; then
            cat /tmp/vercel-login.log
            /tmp/update-arabic-preview-status.sh "LOGIN_URL_NOT_FOUND"
            exit 1
          fi
          /tmp/update-arabic-preview-status.sh "AUTHORIZE $LOGIN_URL"
          wait "$PID"
          vercel whoami
          /tmp/update-arabic-preview-status.sh "AUTHENTICATED"

      - name: Deploy isolated parity preview
        shell: bash
        run: |
          set -e
          mkdir -p "$STAGE_DIR/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > "$STAGE_DIR/.vercel/project.json"
          /tmp/update-arabic-preview-status.sh "DEPLOYING_PARITY_PREVIEW"
          DEPLOY_URL=$(vercel deploy --yes --scope "$TEAM_SLUG" --cwd "$STAGE_DIR" 2>&1 | tee /tmp/deploy.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            cat /tmp/deploy.log
            /tmp/update-arabic-preview-status.sh "DEPLOY_FAILED"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          /tmp/update-arabic-preview-status.sh "DEPLOYED $DEPLOY_URL"

      - name: Verify latest feature parity
        shell: bash
        run: |
          set -e
          sleep 6
          APP_PATH="/apps/fase-d/E-Perangkat_bahasa-arab_Fase-D"
          vercel curl "$DEPLOY_URL$APP_PATH/index.html" --scope "$TEAM_SLUG" > /tmp/index.html
          vercel curl "$DEPLOY_URL$APP_PATH/data.js" --scope "$TEAM_SLUG" > /tmp/data.js
          vercel curl "$DEPLOY_URL$APP_PATH/print.html" --scope "$TEAM_SLUG" > /tmp/print.html
          vercel curl "$DEPLOY_URL/kktp-order-runtime.js" --scope "$TEAM_SLUG" > /tmp/kktp.js
          vercel curl "$DEPLOY_URL/calendar-year.js" --scope "$TEAM_SLUG" > /tmp/kaldik.js
          grep -q "Bahasa Arab" /tmp/index.html
          grep -q "Kalender Pendidikan" /tmp/index.html
          grep -q "KKTP" /tmp/index.html
          grep -q "production-parity-v20260930.js" /tmp/index.html
          grep -q "window.EPERANGKAT_DATA" /tmp/data.js
          grep -q "Paket Cetak E-Perangkat Bahasa Arab" /tmp/print.html
          grep -q "KKTP mengikuti Pesanan" /tmp/kktp.js
          grep -q "calendar-2024-extension.js" /tmp/kaldik.js
          /tmp/update-arabic-preview-status.sh "VERIFIED_PARITY_OK $DEPLOY_URL"

      - name: Connect preview project to GitHub for future no-approval deploys
        shell: bash
        run: |
          set +e
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > .vercel/project.json
          timeout 45s vercel git connect --yes --scope "$TEAM_SLUG" > /tmp/git-connect.log 2>&1
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            /tmp/update-arabic-preview-status.sh "VERIFIED_PARITY_OK_GIT_CONNECTED $DEPLOY_URL"
          else
            cat /tmp/git-connect.log
            /tmp/update-arabic-preview-status.sh "VERIFIED_PARITY_OK_GIT_CONNECT_PENDING $DEPLOY_URL"
          fi
          exit 0
