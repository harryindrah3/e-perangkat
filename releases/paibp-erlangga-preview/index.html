<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview E-Perangkat · PAI BP Versi Erlangga</title></head><body><div id="loader" style="font-family:Arial,sans-serif;padding:32px">Memuat Preview E-Perangkat…</div><script>
(async()=>{"use strict";
const SOURCE="https://cdn.jsdelivr.net/gh/harryindrah3/e-perangkat@a37f7c9455df07b95146acec5bdecbc22c3799e7";
function abs(doc){
 for(const n of doc.querySelectorAll("script[src]")){const v=n.getAttribute("src")||"";if(v&&!/^(?:https?:|data:|blob:)/i.test(v))n.src=new URL(v,SOURCE+"/").href}
 for(const n of doc.querySelectorAll("link[href]")){const v=n.getAttribute("href")||"";if(v&&!/^(?:https?:|data:|blob:|#)/i.test(v))n.href=new URL(v,SOURCE+"/").href}
 for(const n of doc.querySelectorAll("img[src],source[src]")){const v=n.getAttribute("src")||"";if(v&&!/^(?:https?:|data:|blob:)/i.test(v))n.src=new URL(v,SOURCE+"/").href}
}
try{
 const r=await fetch(SOURCE+"/",{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
 const doc=new DOMParser().parseFromString(await r.text(),"text/html"); abs(doc);
 const cat=[...doc.querySelectorAll("script[src]")].find(s=>/\/catalog\.js(?:\?|$)/i.test(s.src));
 if(cat){const p=doc.createElement("script");p.src=new URL("catalog-erlangga.js",location.href).href;cat.after(p)}
 const portal=[...doc.querySelectorAll("script[src]")].find(s=>/\/portal\.js(?:\?|$)/i.test(s.src));
 if(portal){const u=doc.createElement("script");u.src=new URL("portal-erlangga-ui.js",location.href).href;portal.after(u)}
 doc.title="Preview E-Perangkat · PAI BP Versi Erlangga";
 document.open();document.write("<!doctype html>"+doc.documentElement.outerHTML);document.close();
}catch(e){document.getElementById("loader").innerHTML="<b>Gagal memuat preview.</b><br><br>"+String(e.message||e)}
})();
</script></body></html>
