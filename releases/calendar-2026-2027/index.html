<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-Perangkat Online A–F</title>
</head>
<body>
  <div id="x">Memuat…</div>
  <script>
  (async () => {
    'use strict';
    const CURRENT = location.origin + '/__current';
    const OLD_PROXY = location.origin + '/__old';
    const PORTAL_PROXY = location.origin + '/__portal';
    const STABLE_PROXY = location.origin + '/__stable';
    const STABLE_RUNTIME = 'https://e-perangkat-online-a-6xpm8q2nz-harryindrah3-6239s-projects.vercel.app';
    const PRINT_PARITY = 'https://e-perangkat-online-a-afanit1w0-harryindrah3-6239s-projects.vercel.app';
    const DELETE_RUNTIME = STABLE_RUNTIME + '/delete-order.js?v=20260910-5';
    const PRINT_FILENAME_RUNTIME = STABLE_RUNTIME + '/print-filename.js?v=20260911-2';
    const CALENDAR_RUNTIME = STABLE_RUNTIME + '/calendar-level-runtime.js?v=20260914-1';
    const CALENDAR_YEAR_RUNTIME = STABLE_RUNTIME + '/calendar-year.js?v=20260914-1';
    const CALENDAR_SOURCE_RUNTIME = STABLE_RUNTIME + '/calendar-source-runtime.js?v=20260914-2';
    const KKTP_ORDER_RUNTIME = location.origin + '/kktp-order-runtime.js?v=20260915-8';
    const DIFFERENTIATION_RUNTIME = PRINT_PARITY + '/differentiation-runtime.js?v=20260915-2';
    const PRINT_SAFE_PAGES_RUNTIME = PRINT_PARITY + '/print-safe-pages.js?v=20260915-5';
    const IS_APP_PRINT = /\/apps\/.+\/print\.html$/i.test(location.pathname);
    const IS_APP_INDEX = /\/apps\/.+\/index\.html$/i.test(location.pathname);
    const CALENDAR_CLEANUP = '<style id="ep-calendar-print-cleanup"' + (IS_APP_INDEX ? ' media="print"' : '') + '>.ep-calendar-source-box{display:none!important}</style>';

    function showError(error) {
      const target = document.getElementById('x');
      if (!target) return;
      target.innerHTML = '<p style="font-family:Arial,sans-serif;padding:24px;color:#991b1b"><b>E-Perangkat gagal dimuat.</b><br>' + String(error && error.message || error) + '</p>';
    }

    function rewriteNested(output, documentBase) {
      output = output
        .split('https://e-perangkat-online-a-irysp0h7o-harryindrah3-6239s-projects.vercel.app').join(OLD_PROXY)
        .split('https://e-perangkat-online-a-efzg7qnbn-harryindrah3-6239s-projects.vercel.app').join(PORTAL_PROXY)
        .split('https://e-perangkat-online-a-gwl9cq3hd-harryindrah3-6239s-projects.vercel.app').join(STABLE_PROXY);
      output = output.replace(/https:\/\/e-perangkat-online-a-hecmadzal-harryindrah3-6239s-projects\.vercel\.app\/patches\/kaldik\.js(?:\?[^"']*)?/g, CALENDAR_SOURCE_RUNTIME);
      output = output.replace(/<base\b[^>]*>/i, '<base href="' + documentBase + '">');
      return output;
    }

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      const response = await fetch(CURRENT + location.pathname + location.search, { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeout);
      if (!response.ok) throw new Error('Sumber production gagal dimuat (' + response.status + ')');
      let html = await response.text();

      const documentBase = location.origin + location.pathname.replace(/[^/]*$/, '');
      html = rewriteNested(html, documentBase);

      if (IS_APP_PRINT || IS_APP_INDEX) {
        const printFilenameTag = IS_APP_PRINT ? '<scr' + 'ipt src="' + PRINT_FILENAME_RUNTIME + '" id="ep-print-filename-loader"></scr' + 'ipt>' : '';
        const printSafePagesTag = IS_APP_PRINT ? '<scr' + 'ipt src="' + PRINT_SAFE_PAGES_RUNTIME + '" id="ep-print-safe-pages-loader"></scr' + 'ipt>' : '';
        const differentiationRuntimeTag = IS_APP_PRINT ? '<scr' + 'ipt src="' + DIFFERENTIATION_RUNTIME + '" id="ep-differentiation-loader"></scr' + 'ipt>' : '';
        const calendarYearTag = '<scr' + 'ipt src="' + CALENDAR_YEAR_RUNTIME + '" id="ep-calendar-year-loader"></scr' + 'ipt>';
        const calendarRuntimeTag = '<scr' + 'ipt src="' + CALENDAR_RUNTIME + '" id="ep-calendar-level-loader"></scr' + 'ipt>';
        const calendarSourceTag = '<scr' + 'ipt src="' + CALENDAR_SOURCE_RUNTIME + '" id="ep-calendar-source-loader"></scr' + 'ipt>';
        const kktpOrderTag = '<scr' + 'ipt src="' + KKTP_ORDER_RUNTIME + '" id="ep-kktp-order-loader"></scr' + 'ipt>';
        const appEnhancements = CALENDAR_CLEANUP + calendarYearTag + calendarRuntimeTag + calendarSourceTag + kktpOrderTag + printFilenameTag + differentiationRuntimeTag + printSafePagesTag;
        html = html.replace(/<\/head>/i, appEnhancements + '</head>');

        const proto = Document.prototype;
        if (!proto.__epCalendarKktpWriteGuard) {
          proto.__epCalendarKktpWriteGuard = true;
          const nativeWrite = proto.write;
          proto.write = function (...parts) {
            let output = rewriteNested(parts.join(''), documentBase);
            if (!output.includes('id="ep-calendar-year-loader"') ||
                !output.includes('id="ep-calendar-level-loader"') ||
                !output.includes('id="ep-calendar-source-loader"') ||
                !output.includes('id="ep-kktp-order-loader"') ||
                (printFilenameTag && !output.includes('id="ep-print-filename-loader"')) ||
                (differentiationRuntimeTag && !output.includes('id="ep-differentiation-loader"')) ||
                (printSafePagesTag && !output.includes('id="ep-print-safe-pages-loader"'))) {
              output = output.replace(/<\/head>/i, appEnhancements + '</head>');
            }
            return nativeWrite.call(this, output);
          };
        }
      }

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      showError(error?.name === 'AbortError' ? new Error('Sumber aplikasi terlalu lama merespons. Preview dihentikan agar tidak berhenti di Memuat…') : error);
    }
  })();
  </script>
</body>
</html>
