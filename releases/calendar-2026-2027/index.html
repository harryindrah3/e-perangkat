<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-Perangkat Online A–F</title>
</head>
<body>
  <div id="x">Memuat…</div>
  <script>
  (async () => {
    'use strict';

    const PORTAL = 'https://cdn.jsdelivr.net/gh/harryindrah3/e-perangkat@a37f7c9455df07b95146acec5bdecbc22c3799e7';
    const STABLE_SOURCE = 'https://e-perangkat-online-a-gwl9cq3hd-harryindrah3-6239s-projects.vercel.app';
    const STABLE_RUNTIME = 'https://e-perangkat-online-a-6xpm8q2nz-harryindrah3-6239s-projects.vercel.app';
    const PRINT_PARITY = 'https://e-perangkat-online-a-afanit1w0-harryindrah3-6239s-projects.vercel.app';
    const OLD_RUNTIME = 'https://e-perangkat-online-a-irysp0h7o-harryindrah3-6239s-projects.vercel.app';
    const BANK_ASSET = 'https://e-perangkat-bank-soal-assets-3jjitjcq9.vercel.app';

    const CALENDAR_RUNTIME = location.origin + '/calendar-level-runtime.js?v=20260917-2024-1';
    const CALENDAR_YEAR_RUNTIME = location.origin + '/calendar-year.js?v=20260917-2024-1';
    const CALENDAR_SOURCE_RUNTIME = location.origin + '/calendar-source-runtime.js?v=20260917-2024-1';
    const KKTP_ORDER_RUNTIME = location.origin + '/kktp-order-runtime.js?v=20260915-9';
    const PRINT_FILENAME_RUNTIME = STABLE_RUNTIME + '/print-filename.js?v=20260911-2';
    const DIFFERENTIATION_RUNTIME = PRINT_PARITY + '/differentiation-runtime.js?v=20260915-2';
    const PRINT_SAFE_PAGES_RUNTIME = PRINT_PARITY + '/print-safe-pages.js?v=20260915-5';
    const PROMES_FIX = OLD_RUNTIME + '/promes-print-route-fix.js?v=20260909-calendar-slot-fix-4';
    const LOGO_FIX = OLD_RUNTIME + '/logo-fix.js?v=20260909-logo-assets-2';
    const GRADE_ONE_COVER = OLD_RUNTIME + '/grade-one-cover.js?v=20260909-cute-cover-1';
    const COPY_ORDER = OLD_RUNTIME + '/copy-order.js?v=20260908-restore-1';
    const SUPERVISION = OLD_RUNTIME + '/phase-c-supervision.js?v=20260908-all-af-2';

    const IS_APP_PRINT = /\/apps\/.+\/print\.html$/i.test(location.pathname);
    const IS_APP_INDEX = /\/apps\/.+\/index\.html$/i.test(location.pathname);
    const IS_BINDO_C = /^\/apps\/fase-c\/E-Perangkat_bahasa-indonesia_Fase-C\//i.test(location.pathname);

    function showError(error) {
      const target = document.getElementById('x');
      if (!target) return;
      target.innerHTML = '<div style="font-family:Arial,sans-serif;padding:28px;color:#991b1b"><b>E-Perangkat gagal dimuat.</b><br><br>' + String(error && error.message || error) + '<br><br><small>Production tidak diubah. Muat ulang halaman Preview ini atau gunakan deployment Preview terbaru.</small></div>';
    }

    async function fetchText(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error('HTTP ' + response.status + ' saat memuat ' + url);
        return await response.text();
      } finally {
        clearTimeout(timer);
      }
    }

    function absolutize(doc, sourceBase) {
      for (const node of doc.querySelectorAll('script[src]')) {
        const value = node.getAttribute('src') || '';
        if (!value) continue;
        if (value === '/api/patch') {
          node.src = location.origin + value;
        } else if (!/^(?:https?:|data:|blob:)/i.test(value)) {
          node.src = new URL(value, sourceBase + '/').href;
        }
      }
      for (const node of doc.querySelectorAll('link[href]')) {
        const value = node.getAttribute('href') || '';
        if (value && !/^(?:https?:|data:|blob:)/i.test(value)) node.href = new URL(value, sourceBase + '/').href;
      }
      for (const node of doc.querySelectorAll('img[src],source[src]')) {
        const value = node.getAttribute('src') || '';
        if (value && !/^(?:https?:|data:|blob:)/i.test(value)) node.src = new URL(value, sourceBase + '/').href;
      }
    }

    function addScript(doc, src, id) {
      if (id && doc.getElementById(id)) return;
      const script = doc.createElement('script');
      if (id) script.id = id;
      script.src = src;
      script.async = false;
      doc.body.appendChild(script);
    }

    function addInline(doc, code, id) {
      if (id && doc.getElementById(id)) return;
      const script = doc.createElement('script');
      if (id) script.id = id;
      script.textContent = code;
      doc.body.appendChild(script);
    }

    function installLegacyEnhancements(doc) {
      addScript(doc, LOGO_FIX, 'ep-logo-fix-loader');
      addScript(doc, GRADE_ONE_COVER, 'ep-grade-one-cover-loader');
      addScript(doc, PROMES_FIX, 'ep-promes-fix-loader');

      addInline(doc, `(()=>{if(window.__epOrderToolsTimer)return;let checks=0;window.__epOrderToolsTimer=setInterval(()=>{const newOrder=document.getElementById('newOrder');if(newOrder&&!document.getElementById('teacherClassOrder')){const a=document.createElement('a');a.id='teacherClassOrder';a.className='button primary';a.href='/pesanan-guru-kelas';a.textContent='+ Guru Kelas';a.title='Isi identitas sekali untuk banyak mapel';newOrder.parentNode?.insertBefore(a,newOrder)}if(window.EPERANGKAT_CATALOG?.apps?.length&&window.PortalSync&&document.body&&!document.getElementById('epCopyOrderDialog')&&!document.getElementById('ep-copy-order-loader')){const s=document.createElement('script');s.id='ep-copy-order-loader';s.src=${JSON.stringify(COPY_ORDER)};document.body.appendChild(s)}if(document.getElementById('teacherClassOrder')&&document.getElementById('epCopyOrderDialog')){clearInterval(window.__epOrderToolsTimer);window.__epOrderToolsTimer=null}else if(++checks>1200){clearInterval(window.__epOrderToolsTimer);window.__epOrderToolsTimer=null}},50)})();`, 'ep-order-tools-bootstrap');

      addInline(doc, `(()=>{if(window.__epSupervisionTimer)return;let checks=0,queued=false;window.__epSupervisionTimer=setInterval(()=>{if(window.EPERANGKAT_DATA&&document.body&&!queued){queued=true;setTimeout(()=>{if(!document.getElementById('ep-supervision-runtime')){const s=document.createElement('script');s.id='ep-supervision-runtime';s.src=${JSON.stringify(SUPERVISION)};document.body.appendChild(s)}clearInterval(window.__epSupervisionTimer);window.__epSupervisionTimer=null},150)}else if(++checks>600){clearInterval(window.__epSupervisionTimer);window.__epSupervisionTimer=null}},50)})();`, 'ep-supervision-bootstrap');

      if (IS_BINDO_C) {
        addScript(doc, BANK_ASSET + '/bank-data-v.js', 'ep-bank-data-v');
        addScript(doc, BANK_ASSET + '/bank-data-vi.js', 'ep-bank-data-vi');
        addScript(doc, BANK_ASSET + '/bank-runtime.js', 'ep-bank-runtime');
      }
    }

    function installCalendarAndKktp(doc) {
      for (const script of [...doc.querySelectorAll('script[src]')]) {
        const src = script.getAttribute('src') || '';
        if (/\/patches\/kaldik\.js/i.test(src)) script.remove();
      }

      const style = doc.createElement('style');
      style.id = 'ep-calendar-print-cleanup';
      if (IS_APP_INDEX) style.media = 'print';
      style.textContent = '.ep-calendar-source-box{display:none!important}';
      doc.head.appendChild(style);

      addScript(doc, CALENDAR_YEAR_RUNTIME, 'ep-calendar-year-loader');
      addScript(doc, CALENDAR_RUNTIME, 'ep-calendar-level-loader');
      addScript(doc, CALENDAR_SOURCE_RUNTIME, 'ep-calendar-source-loader');
      addScript(doc, KKTP_ORDER_RUNTIME, 'ep-kktp-order-loader');
    }

    function installPrintFixes(doc) {
      if (!IS_APP_PRINT) return;
      addScript(doc, PRINT_FILENAME_RUNTIME, 'ep-print-filename-loader');
      addScript(doc, DIFFERENTIATION_RUNTIME, 'ep-differentiation-loader');
      addScript(doc, PRINT_SAFE_PAGES_RUNTIME, 'ep-print-safe-pages-loader');
    }

    try {
      let sourceOrigin = PORTAL;
      let html;
      const portalPath = location.pathname === '/' ? '/index.html' : location.pathname;
      try {
        html = await fetchText(PORTAL + portalPath + location.search);
      } catch (_) {
        sourceOrigin = STABLE_SOURCE;
        html = await fetchText(STABLE_SOURCE + location.pathname + location.search);
      }

      const sourceDirectory = location.pathname.endsWith('/') ? location.pathname : location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
      const sourceBase = (sourceOrigin + sourceDirectory).replace(/\/+$/, '');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      absolutize(doc, sourceBase);
      installLegacyEnhancements(doc);
      installCalendarAndKktp(doc);
      installPrintFixes(doc);

      document.open();
      document.write('<!doctype html>' + doc.documentElement.outerHTML);
      document.close();
    } catch (error) {
      showError(error?.name === 'AbortError' ? new Error('Sumber aplikasi terlalu lama merespons. Permintaan dihentikan agar halaman tidak berhenti pada “Memuat…”.') : error);
    }
  })();
  </script>
</body>
</html>
